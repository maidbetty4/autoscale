[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maidbetty4-autoscale"
version = "0.1.0"
description = "从样本里推断弹性伸缩的震荡抑制应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "maidbetty4" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://maidbetty4.github.io"
Repository = "https://github.com/maidbetty4/autoscale"
Issues = "https://github.com/maidbetty4/autoscale/issues"

[project.scripts]
autoscale = "autoscale:main"

[tool.setuptools]
py-modules = ["autoscale"]
